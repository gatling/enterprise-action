version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    labels:
      - "dependencies"
      - "npm"
    schedule:
      interval: "weekly"
      day: "sunday"
    ignore:
      # the major version for Node should match the runtime configured in action.yml
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "github_actions"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
